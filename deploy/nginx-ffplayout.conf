# ffplayout - nginx reverse proxy template
#
# Placeholders: @BIND_ADDR@, @BIND_PORT@  (substituted by install.sh)
#
# The block below is only needed for WebSocket / SSE upgrades.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream ffplayout_app {
    server @BIND_ADDR@:@BIND_PORT@;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 0;

    # HLS: ffmpeg rewrites the playlist constantly - never buffer, never cache.
    location /hls {
        proxy_pass http://ffplayout_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header Cache-Control "no-store" always;
    }

    # per-channel live HLS (e.g. /1/live/master.m3u8)
    location /1/live {
        proxy_pass http://ffplayout_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        add_header Cache-Control "no-store" always;
    }

    # uploads / exports can be huge
    location /file {
        proxy_pass http://ffplayout_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # API + web UI
    location / {
        proxy_pass http://ffplayout_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}